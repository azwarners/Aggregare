# Copy outside the repository and replace the documentation-only IP with the
# current dev host's private LAN address. Run the playbook from the Linux
# browser/control machine so localhost is the machine whose /etc/hosts and CA
# store you intend to configure.
[aggregare_dev]
aggregare-dev ansible_host=192.0.2.10 ansible_user=nick

[aggregare_dev:vars]
aggregare_environment=dev
aggregare_lan_address=192.0.2.10
aggregare_private_zone=dev.aggregare.home.arpa
