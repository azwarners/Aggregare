---
- name: Validate Redless deployment configuration
  ansible.builtin.assert:
    that:
      - redless_state in ['present', 'absent']
      - redless_source is match('^https://')
      - redless_ref is match('^[0-9a-f]{40}$')
      - aggregare_primary_users is sequence
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('24.04', '>=')
    fail_msg: Redless requires a pinned HTTPS source and a configured list of primary Aggregare users.

- name: Remove Redless
  when: redless_state == 'absent'
  block:
    - name: Stop and remove the Redless service if present
      ansible.builtin.systemd_service:
        name: redless.service
        state: stopped
        enabled: false
      failed_when: false
    - name: Remove Redless application installation
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/aggregare/redless
        - /opt/aggregare/venvs/redless
        - /etc/systemd/system/redless.service
        - /usr/local/bin/redless-machine
        - /usr/local/bin/aggregare-redless-task
        - /usr/local/bin/aggRedless
        - /usr/local/bin/redless-issue-queue
        - /usr/local/lib/aggregare/aggregare_redless_task.py
        - /usr/local/lib/aggregare/redless_task_adapter.py
    - name: Remove the Redless deployment status record
      ansible.builtin.file:
        path: /var/lib/aggregare/status/redless.json
        state: absent
    - name: Purge Redless persistent data only when explicitly requested
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ redless_home }}"
        - "{{ redless_log_path }}"
      when: redless_purge_data | bool
    - name: Remove the Redless account without affecting its group members
      ansible.builtin.user:
        name: "{{ redless_user }}"
        state: absent
        remove: false
    - name: Remove the Redless primary group
      ansible.builtin.group:
        name: "{{ redless_group }}"
        state: absent

- name: Install and configure Redless
  when: redless_state == 'present'
  block:
    - name: Inspect the legacy Redless launcher without following links
      ansible.builtin.stat:
        path: /usr/local/bin/redless-machine
        follow: false
      register: redless_legacy_launcher

    - name: Remove a legacy setuid Redless regular executable during upgrade
      ansible.builtin.file:
        path: /usr/local/bin/redless-machine
        state: absent
      when:
        - redless_legacy_launcher.stat.isreg | default(false)
        - (redless_legacy_launcher.stat.mode | default('')) is match('^4[0-7]{3}$')

    - name: Check for the persisted Ysparr coding target
      ansible.builtin.stat:
        path: "{{ redless_upstream_config_path }}"
      register: redless_upstream_config_file

    - name: Read the persisted Ysparr coding target
      ansible.builtin.slurp:
        src: "{{ redless_upstream_config_path }}"
      register: redless_saved_upstream_config_raw
      when: redless_upstream_config_file.stat.exists
      no_log: true

    - name: Decode the persisted Ysparr coding target
      ansible.builtin.set_fact:
        redless_saved_upstream_config: >-
          {{ (redless_saved_upstream_config_raw.content | b64decode | from_json)
             if redless_upstream_config_file.stat.exists else {} }}
      no_log: true

    - name: Resolve the explicit Redless coding target
      ansible.builtin.set_fact:
        redless_coding_base_url_effective: >-
          {{ redless_coding_base_url | default('', true) | trim
             or redless_saved_upstream_config.ysparr_coding_base_url | default('') | trim }}
        redless_coding_model_effective: >-
          {{ redless_coding_model | default('', true) | trim
             or redless_saved_upstream_config.ysparr_coding_model | default('') | trim }}
      no_log: true

    - name: Normalize and validate the Redless coding target
      ansible.builtin.set_fact:
        redless_coding_base_url_effective: >-
          {{ redless_coding_base_url_effective if '://' in redless_coding_base_url_effective
             else ('http://' ~ redless_coding_base_url_effective if redless_coding_base_url_effective else '') }}
      no_log: true

    - name: Build the direct OpenAI-compatible API base for Redless
      ansible.builtin.set_fact:
        redless_coding_api_base: >-
          {{ (redless_coding_base_url_effective | regex_replace('/v1/?$', '') | regex_replace('/+$', '')) ~ '/v1' }}
      no_log: true

    - name: Require a real explicit coding endpoint and model
      ansible.builtin.assert:
        that:
          - redless_coding_model_effective | length > 0
          - redless_coding_model_effective is match('^\\S+$')
          - redless_coding_base_url_effective | urlsplit('scheme') in ['http', 'https']
          - redless_coding_base_url_effective | urlsplit('hostname') | length > 0
          - redless_coding_base_url_effective | urlsplit('path') in ['', '/', '/v1', '/v1/']
          - redless_coding_base_url_effective | urlsplit('username') | default('', true) | length == 0
          - redless_coding_base_url_effective | urlsplit('password') | default('', true) | length == 0
          - redless_coding_base_url_effective | urlsplit('query') | default('', true) | length == 0
          - redless_coding_base_url_effective | urlsplit('fragment') | default('', true) | length == 0
        fail_msg: >-
          Redless requires the configured coding endpoint and model from
          ysparr_coding_base_url and ysparr_coding_model (or the saved
          /etc/aggregare/ysparr-upstream.json). It never falls back to chat or
          to a guessed local endpoint.

    - name: Check the configured Redless coding model endpoint
      ansible.builtin.uri:
        url: "{{ redless_coding_api_base }}/models"
        method: GET
        status_code: [200, 401, 403, 404]
        return_content: true
        timeout: 8
        validate_certs: true
      register: redless_coding_models_probe
      failed_when: false
      no_log: true

    - name: Record Redless coding endpoint readiness without destroying a valid reapply
      ansible.builtin.set_fact:
        redless_coding_readiness: >-
          {{ 'passed' if redless_coding_models_probe.status | default(0) | int == 200 and
             redless_coding_model_effective in ((redless_coding_models_probe.json | default({})).data | default([]) | map(attribute='id') | list)
             else 'unavailable' }}
      # Redless does not substitute the chat model or retry another endpoint.

    - name: Install Redless filesystem ACL and Python prerequisites
      ansible.builtin.apt:
        name: [acl, git, python3, python3-venv, python3-pip]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the unprivileged Redless primary group
      ansible.builtin.group:
        name: "{{ redless_group }}"
        system: false
        state: present

    - name: Check for the preferred Redless login shell
      ansible.builtin.stat:
        path: /bin/bash
      register: redless_bash

    - name: Create the unprivileged Redless account with a normal home and shell
      ansible.builtin.user:
        name: "{{ redless_user }}"
        group: "{{ redless_group }}"
        groups: "{{ redless_group }}"
        append: false
        home: "{{ redless_home }}"
        create_home: true
        shell: "{{ '/bin/bash' if redless_bash.stat.exists else '/bin/sh' }}"
        password_lock: true
        system: false
        state: present

    - name: Add only explicitly configured primary Aggregare users to Redless
      ansible.builtin.user:
        name: "{{ item }}"
        groups: "{{ redless_group }}"
        append: true
      loop: "{{ aggregare_primary_users }}"

    - name: Create Redless persistent directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(redless_user) }}"
        group: "{{ item.group | default(redless_group) }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ redless_home }}", mode: '0710'}
        - {path: "{{ redless_workspace_path }}", group: root, mode: '2750'}
        - {path: "{{ redless_run_path }}", group: root, mode: '2750'}
        - {path: "{{ redless_log_path }}", group: root, mode: '2750'}
        - {path: "{{ redless_config_path }}", mode: '0700'}

    - name: Restore ownership of preserved Redless artifacts after reinstall
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ redless_user }}"
        group: root
        recurse: true
      loop:
        - "{{ redless_workspace_path }}"
        - "{{ redless_run_path }}"
        - "{{ redless_log_path }}"

    - name: Grant configured human users access to new Redless artifacts
      ansible.builtin.command:
        argv: [setfacl, -m, "g:{{ redless_group }}:r-x,m::r-x", "{{ item }}"]
      loop: ["{{ redless_workspace_path }}", "{{ redless_run_path }}", "{{ redless_log_path }}"]
      changed_when: false

    - name: Set read-only default group access for Redless-created artifacts
      ansible.builtin.command:
        argv: [setfacl, -m, "d:u::rwx,d:g::---,d:g:{{ redless_group }}:r-x,d:m::r-x,d:o::---", "{{ item }}"]
      loop: ["{{ redless_workspace_path }}", "{{ redless_run_path }}", "{{ redless_log_path }}"]
      changed_when: false

    - name: Install Redless from its pinned compatible revision
      ansible.builtin.include_role:
        name: python_app
      vars:
        python_app_id: redless
        python_app_version: "{{ redless_version }}"
        python_app_source: "{{ redless_source }}"
        python_app_ref: "{{ redless_ref }}"
        python_app_module: minisweagent
        python_app_service_enabled: false

    - name: Install the persistent Redless coding-model profile
      ansible.builtin.copy:
        dest: "{{ redless_config_path }}/slow_local.yaml"
        owner: "{{ redless_user }}"
        group: "{{ redless_group }}"
        mode: '0600'
        content: |
          agent:
            agent_class: default
            system_template: |
              You are a coding agent working in the supplied workspace. Complete the user's bounded task and report the result clearly.
            instance_template: |
              {{ '{{task}}' }}
            step_limit: 0
            cost_limit: 0
            wall_time_limit_seconds: 0
          environment:
            environment_class: local
            timeout: 600
          model:
            model_class: llama_cpp
            cost_tracking: disabled
            connect_timeout_seconds: 30
            model_timeout_seconds: 0
            max_retries: 0
            model_kwargs:
              api_base: {{ redless_coding_api_base | to_json }}
              api_key: llama.cpp-placeholder
            model_name: {{ redless_coding_model_effective | to_json }}

    - name: Install the bounded Redless live-smoke profile
      ansible.builtin.copy:
        dest: "{{ redless_config_path }}/redless_smoke.yaml"
        owner: "{{ redless_user }}"
        group: "{{ redless_group }}"
        mode: '0600'
        content: |
          agent:
            agent_class: default
            system_template: |
              You are a coding agent working in the supplied workspace. Complete the user's bounded task and report the result clearly.
            instance_template: |
              {{ '{{task}}' }}
            step_limit: 1
            cost_limit: 0
            wall_time_limit_seconds: {{ redless_live_smoke_timeout }}
          environment:
            environment_class: local
            timeout: {{ redless_live_smoke_timeout }}
          model:
            model_class: llama_cpp
            cost_tracking: disabled
            connect_timeout_seconds: 30
            model_timeout_seconds: {{ redless_live_model_timeout }}
            max_retries: 0
            model_kwargs:
              api_base: {{ redless_coding_api_base | to_json }}
              api_key: llama.cpp-placeholder
            model_name: {{ redless_coding_model_effective | to_json }}

    - name: Ensure the Redless package entry points are root-owned and non-writable by the worker
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - /opt/aggregare/venvs/redless/bin/redless
        - /opt/aggregare/venvs/redless/bin/redless-machine

    - name: Install the root-owned Redless task adapter module
      ansible.builtin.file:
        path: /usr/local/lib/aggregare
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the root-owned Redless task adapter module contents
      ansible.builtin.copy:
        src: "{{ role_path }}/../../../tools/redless_task_adapter.py"
        dest: /usr/local/lib/aggregare/redless_task_adapter.py
        owner: root
        group: root
        mode: '0644'

    - name: Install the root-owned Redless task CLI module
      ansible.builtin.copy:
        src: "{{ role_path }}/../../../tools/aggregare_redless_task.py"
        dest: /usr/local/lib/aggregare/aggregare_redless_task.py
        owner: root
        group: root
        mode: '0644'

    - name: Install the root-owned Redless task CLI wrapper
      ansible.builtin.copy:
        src: "{{ role_path }}/../../../tools/aggregare-redless-task"
        dest: /usr/local/bin/aggregare-redless-task
        owner: root
        group: root
        mode: '0755'

    - name: Install the short Redless task CLI alias
      ansible.builtin.file:
        src: /usr/local/bin/aggregare-redless-task
        dest: /usr/local/bin/aggRedless
        state: link
        owner: root
        group: root

    - name: Install the Redless GitHub issue queue
      ansible.builtin.copy:
        src: "{{ role_path }}/../../../tools/redless-issue-queue.sh"
        dest: /usr/local/bin/redless-issue-queue
        owner: root
        group: root
        mode: '0755'

    - name: Verify the short Redless task CLI alias as the unprivileged worker
      ansible.builtin.command:
        argv: [/usr/local/bin/aggRedless, --help]
      become_user: "{{ redless_user }}"
      environment:
        HOME: "{{ redless_home }}"
        MSWEA_CONFIG_DIR: "{{ redless_config_path }}"
      register: agg_redless_help
      changed_when: false
      failed_when: agg_redless_help.rc != 0

    - name: Verify the installed Redless machine help as the unprivileged worker
      ansible.builtin.command:
        argv: [/opt/aggregare/venvs/redless/bin/redless-machine, --help]
      become_user: "{{ redless_user }}"
      environment:
        HOME: "{{ redless_home }}"
        MSWEA_CONFIG_DIR: "{{ redless_config_path }}"
      register: redless_help
      changed_when: false
      failed_when: redless_help.rc != 0

    - name: Verify the installed Aggregare Redless task CLI help as the unprivileged worker
      ansible.builtin.command:
        argv: [/usr/local/bin/aggregare-redless-task, --help]
      become_user: "{{ redless_user }}"
      environment:
        HOME: "{{ redless_home }}"
        MSWEA_CONFIG_DIR: "{{ redless_config_path }}"
      register: aggregare_redless_task_help
      changed_when: false
      failed_when: aggregare_redless_task_help.rc != 0

    - name: Create an isolated workspace for the deterministic contract fixture
      ansible.builtin.file:
        path: /tmp/aggregare-redless-fixture
        state: directory
        owner: "{{ redless_user }}"
        group: "{{ redless_group }}"
        mode: '0700'

    - name: Run the real Redless machine entry point with its pinned fixture
      ansible.builtin.command:
        argv: [/opt/aggregare/venvs/redless/bin/redless-machine, --fixture]
        stdin: >-
          {"type":"task","payload":{"contract_version":"1","run_id":"aggregare-install-fixture","correlation_id":"aggregare-install","task":"fixture:success","workspace":{"contract_version":"1","mode":"existing","path":"/tmp/aggregare-redless-fixture"}}}
      become_user: "{{ redless_user }}"
      environment:
        HOME: "{{ redless_home }}"
        MSWEA_CONFIG_DIR: "{{ redless_config_path }}"
      register: redless_fixture
      changed_when: false
      failed_when: redless_fixture.rc != 0 or redless_fixture.stdout_lines | length < 3

    - name: Parse the deterministic fixture JSONL output
      ansible.builtin.set_fact:
        redless_fixture_records: "{{ redless_fixture.stdout_lines | map('from_json') | list }}"

    - name: Verify the deterministic fixture terminal result and clean stderr
      ansible.builtin.assert:
        that:
          - redless_fixture_records | selectattr('type', 'equalto', 'status') | list | length >= 2
          - redless_fixture_records | selectattr('type', 'equalto', 'result') | list | length == 1
          - (redless_fixture_records | selectattr('type', 'equalto', 'result') | list | first).payload.run_id == 'aggregare-install-fixture'
          - (redless_fixture_records | selectattr('type', 'equalto', 'result') | list | first).payload.state == 'succeeded'
          - redless_fixture.stderr | trim == ''

    - name: Record package and fixture verification
      ansible.builtin.set_fact:
        redless_fixture_verification: passed

    - name: Mark live model smoke as not run unless explicitly requested
      ansible.builtin.set_fact:
        redless_live_verification: not_run
      when: not redless_live_smoke | bool

    - name: Verify malformed machine input returns a structured JSONL error
      ansible.builtin.command:
        argv: [/opt/aggregare/venvs/redless/bin/redless-machine, --fixture]
        stdin: "not-json\n"
      become_user: "{{ redless_user }}"
      environment:
        HOME: "{{ redless_home }}"
        MSWEA_CONFIG_DIR: "{{ redless_config_path }}"
      register: redless_malformed
      changed_when: false
      failed_when: >-
        redless_malformed.rc != 0 or
        (redless_malformed.stdout_lines | map('from_json') | list | first).type != 'error'

    - name: Create a unique bounded live Redless smoke workspace
      ansible.builtin.set_fact:
        redless_live_run_id: "aggregare-live-{{ ansible_facts.date_time.iso8601_basic_short | lower }}"
        redless_live_workspace: "{{ redless_workspace_path }}/aggregare-live-{{ ansible_facts.date_time.iso8601_basic_short | lower }}"
        redless_live_result: "{{ redless_run_path }}/aggregare-live-{{ ansible_facts.date_time.iso8601_basic_short | lower }}.json"
        redless_live_trajectory: "{{ redless_run_path }}/aggregare-live-{{ ansible_facts.date_time.iso8601_basic_short | lower }}.trajectory.json"
        redless_live_stdout: "{{ redless_log_path }}/aggregare-live-{{ ansible_facts.date_time.iso8601_basic_short | lower }}.stdout.jsonl"
        redless_live_stderr: "{{ redless_log_path }}/aggregare-live-{{ ansible_facts.date_time.iso8601_basic_short | lower }}.stderr.log"
      when: redless_live_smoke | bool

    - name: Create the live smoke workspace
      ansible.builtin.file:
        path: "{{ redless_live_workspace }}"
        state: directory
        owner: "{{ redless_user }}"
        group: "{{ redless_group }}"
        mode: '0700'
      when: redless_live_smoke | bool

    - name: Submit exactly one bounded live Redless JSONL task
      ansible.builtin.shell: >-
        set -o pipefail;
        printf '%s\n' {{ {
          'type': 'task',
          'payload': {
            'contract_version': '1',
            'run_id': redless_live_run_id,
            'correlation_id': redless_live_run_id,
            'task': 'Return Hello from Redless and the current UTC timestamp, then stop.',
            'workspace': {'contract_version': '1', 'mode': 'existing', 'path': redless_live_workspace},
            'model': {'profile': 'redless_smoke.yaml', 'model_name': redless_coding_model_effective, 'endpoint_url': redless_coding_api_base},
            'execution_policy': {'timeout_seconds': redless_live_smoke_timeout, 'wall_time_limit_seconds': redless_live_smoke_timeout},
            'destinations': {'result_path': redless_live_result, 'trajectory_path': redless_live_trajectory}
          }
        } | to_json | quote }} |
        /usr/bin/timeout --signal=TERM {{ redless_live_smoke_timeout }}
        /opt/aggregare/venvs/redless/bin/redless-machine
        >{{ redless_live_stdout }} 2>{{ redless_live_stderr }}
      args:
        executable: /bin/bash
      become_user: "{{ redless_user }}"
      environment:
        HOME: "{{ redless_home }}"
        MSWEA_CONFIG_DIR: "{{ redless_config_path }}"
      register: redless_live
      changed_when: false
      when: redless_live_smoke | bool

    - name: Inspect live Redless smoke artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ redless_live_stdout }}"
        - "{{ redless_live_stderr }}"
        - "{{ redless_live_trajectory }}"
        - "{{ redless_live_result }}"
      register: redless_live_artifacts
      when: redless_live_smoke | bool

    - name: Read the live Redless stdout JSONL
      ansible.builtin.slurp:
        src: "{{ redless_live_stdout }}"
      register: redless_live_stdout_raw
      when: redless_live_smoke | bool

    - name: Parse the live Redless terminal records
      ansible.builtin.set_fact:
        redless_live_records: "{{ (redless_live_stdout_raw.content | b64decode).splitlines() | map('from_json') | list }}"
      when: redless_live_smoke | bool

    - name: Verify the live Redless task and saved trajectory
      ansible.builtin.assert:
        that:
          - redless_live.rc == 0
          - redless_live_records | selectattr('type', 'equalto', 'result') | list | length == 1
          - (redless_live_records | selectattr('type', 'equalto', 'result') | list | first).payload.state == 'succeeded'
          - (redless_live_artifacts.results | selectattr('item', 'equalto', redless_live_trajectory) | map(attribute='stat.exists') | first) | bool
          - (redless_live_artifacts.results | selectattr('item', 'equalto', redless_live_stdout) | map(attribute='stat.exists') | first) | bool
          - (redless_live_artifacts.results | selectattr('item', 'equalto', redless_live_stderr) | map(attribute='stat.exists') | first) | bool
        fail_msg: >-
          The bounded Redless live smoke task did not produce a succeeded terminal
          result and saved trajectory. Inspect the separate stdout/stderr paths.
      when: redless_live_smoke | bool

    - name: Record successful live model verification
      ansible.builtin.set_fact:
        redless_live_verification: passed
      when: redless_live_smoke | bool

    - name: Write Redless deployment status
      ansible.builtin.copy:
        dest: /var/lib/aggregare/status/redless.json
        owner: root
        group: root
        mode: '0644'
        content: >-
          {{ {'schema_version': 'v1', 'application_id': 'redless', 'state': 'installed',
             'version': redless_version, 'deployment': {'backend': 'ansible', 'method': 'native-python',
             'account': redless_user, 'group': redless_group, 'home': redless_home, 'workspace': redless_workspace_path, 'runs': redless_run_path,
             'logs': redless_log_path, 'operator_cli': '/usr/local/bin/aggregare-redless-task',
             'coding_endpoint': redless_coding_base_url_effective,
             'coding_model': redless_coding_model_effective}, 'verification': {'status': redless_fixture_verification,
             'fixture': redless_fixture_verification, 'live_model': redless_live_verification,
             'coding_readiness': redless_coding_readiness,
             'check': 'redless-machine help and fixture as ' ~ redless_user,
             'coding_endpoint': redless_coding_base_url_effective,
             'coding_model': redless_coding_model_effective,
             'live_run': redless_live_run_id | default('not-run')}} | to_nice_json }}
