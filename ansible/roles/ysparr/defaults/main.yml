---
ysparr_state: present
# Bump when the managed Ysparr branch changes so installer recovery does not
# preserve a healthy but stale source checkout.
ysparr_version: 0.1.1
# Keep the default development bundle aligned with the coordinated Apmatia
# authentication work. Promote this back to main after both branches land.
ysparr_source_ref: feat/apmatia-13-authenticated-ysparr-agents
ysparr_host: 127.0.0.1
ysparr_port: 8000
ysparr_upstream_base_url: ''
ysparr_chat_model: ''
ysparr_coding_base_url: ''
ysparr_coding_model: ''
# Additional Ysparr target metadata routes. The OpenAI-compatible Apmatia
# starters are routed to the selected chat model automatically; operators can
# override or add routes with upstream model IDs.
ysparr_model_type_routes: {}
ysparr_database_path: /var/lib/ysparr/ysparr.sqlite3
ysparr_upstream_api_key: ''
ysparr_upstream_api_key_reset: false
ysparr_upstream_config_path: /etc/aggregare/ysparr-upstream.json
ysparr_extension_base_urls:
  - "http://127.0.0.1:{{ apmatia_port | default(8001) }}"
ysparr_extension_api_key: ''
ysparr_extension_allowed_roles: system,developer
ysparr_extension_context_failure: skip
ysparr_retention_completed: 7d
ysparr_retention_failed: 24h
ysparr_retention_orphaned: 30d
