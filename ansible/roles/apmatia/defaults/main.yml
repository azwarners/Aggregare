---
apmatia_state: present
apmatia_version: 0.0.1.7
apmatia_source: https://github.com/azwarners/Apmatia.git
# Keep the default development bundle aligned with Ysparr's coordinated
# authentication work. Promote this back to main after both branches land.
apmatia_source_ref: feat/apmatia-13-authenticated-ysparr-agents
apmatia_host: 127.0.0.1
apmatia_port: 8001
apmatia_api_url: "http://127.0.0.1:{{ apmatia_port }}/api"
apmatia_home: /var/lib/apmatia/app
apmatia_data_dir: /var/lib/apmatia/data
apmatia_config_dir: /var/lib/apmatia/config
apmatia_credentials_path: /etc/aggregare/apmatia-credentials.json
apmatia_bootstrap_state_path: /etc/aggregare/apmatia-bootstrap-state.json
apmatia_bootstrap_username: aggregare-owner
apmatia_upstream_base_url: ''
apmatia_upstream_api_key: ''
apmatia_upstream_config_path: /etc/aggregare/ysparr-upstream.json
apmatia_public_base_url: "http://{{ apmatia_host }}:{{ apmatia_port }}"
