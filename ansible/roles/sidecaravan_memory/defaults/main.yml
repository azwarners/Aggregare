---
sidecaravan_state: present
sidecaravan_version: 0.1.0
sidecaravan_source: https://github.com/azwarners/Sidecaravan.git
# Keep the default bundle on the current tested Sidecaravan integration branch
# until its MCP boundary is merged. Change this back to main after promotion,
# or override it in protected inventory for another reviewed ref.
sidecaravan_source_ref: feat/issue-5-shared-memory-interface
# Set this to a controller-local checkout for development. When empty, Ansible
# checks out sidecaravan_source at sidecaravan_source_ref on the managed host.
sidecaravan_source_path: ''
sidecaravan_source_dir: /opt/aggregare/sidecaravan-source
sidecaravan_venv: /opt/aggregare/venvs/sidecaravan
sidecaravan_data_dir: /var/lib/aggregare/sidecaravan
sidecaravan_store: /var/lib/aggregare/sidecaravan/team.sqlite
sidecaravan_token_file: /var/lib/aggregare/sidecaravan/team.token
sidecaravan_group: aggregare-memory
sidecaravan_authorized_users: []
sidecaravan_wrapper: /usr/local/bin/scv
sidecaravan_mcp_socket: /run/aggregare/sidecaravan-mcp.sock
sidecaravan_mcp_socket_unit: sidecaravan-mcp.socket
sidecaravan_mcp_service_unit: sidecaravan-mcp@.service
sidecaravan_team_token: ''
# One-shot administrative rotation. Leave false for normal idempotent runs.
sidecaravan_rotate_token: false

memkeeper_version: v0.5.3
memkeeper_target: x86_64-unknown-linux-gnu
memkeeper_install_dir: /usr/local/bin
memkeeper_binary: /usr/local/bin/memkeeper
memkeeper_version_marker: /usr/local/bin/memkeeper.installed-version
memkeeper_download_dir: /var/cache/aggregare/memkeeper
memkeeper_embed_provider: none
memkeeper_rerank_provider: none
# Sidecaravan's supported no-model path is the lexical-only source build. This
# keeps fresh installs independent of optional semantic model downloads.
memkeeper_build_lexical_only: true
memkeeper_source: https://github.com/teflon07/memkeeper.git
memkeeper_source_dir: /opt/aggregare/memkeeper-source
