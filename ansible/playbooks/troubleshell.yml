- name: Install or remove TroubleShell
  hosts: desktop
  become: true
  vars:
    python_app_id: troubleshell
    python_app_version: '0.2'
    python_app_source: https://github.com/azwarners/TroubleShell.git
    python_app_ref: main
    python_app_module: troubleshell
    python_app_system_packages:
    - python3-gi
    - gir1.2-gtk-4.0
    - gir1.2-vte-3.91
    - libvte-2.91-gtk4-0
    python_app_system_site_packages: true
  pre_tasks:
  - name: Require the supported TroubleShell desktop platform
    ansible.builtin.assert:
      that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('26.04', '>=')
      fail_msg: TroubleShell is currently tested on Ubuntu 26.04 desktop systems.
  tasks:
  - name: Install TroubleShell from its main branch
    ansible.builtin.import_role:
      name: python_app
