---
- name: Install or remove Open WebUI
  hosts: aggregare
  become: true
  vars:
    application_id: open-webui
    application_version: '0.11.4'
    application_image: ghcr.io/open-webui/open-webui:v0.11.4
    application_host_port: 8080
    application_container_port: 8080
    # Open WebUI shares the host network so it can reach Ysparr on loopback;
    # only its own HTTP listener follows Aggregare's explicit bind policy.
    application_host_network: true
    application_unit_after: [ysparr.service]
    application_unit_wants: [ysparr.service]
    application_data_path: /var/lib/aggregare/open-webui
    application_container_data_path: /app/backend/data
    application_environment:
      ENABLE_OPENAI_API: 'true'
      OPENAI_API_BASE_URL: "http://{{ ysparr_host | default('127.0.0.1') }}:{{ ysparr_port | default(8000) }}/v1"
      ENABLE_OLLAMA_API: 'false'
      ENABLE_DIRECT_CONNECTIONS: 'false'
      ENABLE_DIRECT_INTEGRATIONS: 'false'
      ENABLE_PLUGINS: 'false'
      ENABLE_CODE_EXECUTION: 'false'
      ENABLE_CODE_INTERPRETER: 'false'
      DEFAULT_MODEL_METADATA: '{"capabilities":{"builtin_tools":false},"toolIds":[]}'
      ENABLE_MEMORIES: 'false'
      ENABLE_SUBAGENTS: 'false'
      ENABLE_AUTOMATIONS: 'false'
      ENABLE_WEB_SEARCH: 'false'
      ENABLE_IMAGE_GENERATION: 'false'
      ENABLE_GOOGLE_DRIVE_INTEGRATION: 'false'
      ENABLE_ONEDRIVE_INTEGRATION: 'false'
      WEBUI_AUTH: 'true'
      ENABLE_SIGNUP: 'true'
      DEFAULT_USER_ROLE: 'pending'
      HOST: "{{ application_bind_address | default('127.0.0.1') }}"
      PORT: '8080'
    application_health_path: /health
  tasks:
  - name: Apply the shared OCI application role
    ansible.builtin.import_role:
      name: container_app

  - name: Enforce chat-only model defaults without resetting unrelated settings
    ansible.builtin.command:
      argv:
        - python3
        - "{{ playbook_dir }}/../../tools/aggregare-open-webui-chat-only"
        - --database
        - "{{ application_data_path }}/webui.db"
    register: open_webui_chat_only
    changed_when: (open_webui_chat_only.stdout | from_json).changed

  - name: Restart Open WebUI after changing persisted model defaults
    ansible.builtin.systemd_service:
      name: open-webui.service
      state: restarted
    when: (open_webui_chat_only.stdout | from_json).changed

  - name: Verify Open WebUI after applying persisted model defaults
    ansible.builtin.uri:
      url: "http://{{ application_bind_address }}:{{ application_host_port }}{{ application_health_path }}"
      method: GET
      status_code: "{{ application_health_status_codes }}"
    register: open_webui_chat_only_health
    retries: 30
    delay: 20
    until: open_webui_chat_only_health.status | default(0) in application_health_status_codes
    when: (open_webui_chat_only.stdout | from_json).changed
