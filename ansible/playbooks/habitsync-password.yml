---
- name: Secure and validate a new HabitSync local password
  hosts: aggregare
  become: true
  gather_facts: false
  vars_prompt:
    - name: habitsync_new_password
      prompt: New HabitSync local password
      private: true
      confirm: true
  tasks:
    - name: Require the installer-managed password source
      ansible.builtin.assert:
        that:
          - habitsync_new_password | length > 0
          - habitsync_new_password == habitsync_new_password | trim
          - habitsync_recovery_user is defined
          - habitsync_recovery_user is match('^[a-z0-9][a-z0-9-]{0,35}$')
          - habitsync_recovery_password is not defined
          - habitsync_recovery_password_hash is not defined
        fail_msg: >-
          Set a nonempty password without leading or trailing whitespace. This
          command requires the installer-managed password source and cannot
          override habitsync_recovery_password or
          habitsync_recovery_password_hash configured in inventory.

    - name: Hash the new HabitSync password for persistent configuration
      ansible.builtin.command:
        argv: [htpasswd, -niBC, '10', "{{ habitsync_recovery_user }}"]
        stdin: "{{ habitsync_new_password }}"
      register: habitsync_new_password_hash_result
      changed_when: false
      no_log: true

    - name: Save the password hash instead of the clear-text password
      ansible.builtin.copy:
        dest: /etc/aggregare/secrets/habitsync-password-hash
        content: "{{ habitsync_new_password_hash_result.stdout.split(':', 1)[1] }}\n"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Pass the password hash to the imported HabitSync deployment play
      ansible.builtin.set_fact:
        habitsync_recovery_password_hash: "{{ habitsync_new_password_hash_result.stdout.split(':', 1)[1] }}"
      no_log: true

- name: Apply HabitSync with the new local password
  ansible.builtin.import_playbook: habitsync.yml

- name: Remove the superseded initial login handoff after password rotation
  hosts: aggregare
  become: true
  gather_facts: false
  tasks:
    - name: Remove the stored initial HabitSync login
      ansible.builtin.file:
        path: /etc/aggregare/habitsync-credentials
        state: absent

    - name: Remove the superseded clear-text password source
      ansible.builtin.file:
        path: /etc/aggregare/secrets/habitsync-password
        state: absent

    - name: Mark the initial HabitSync password as rotated
      ansible.builtin.file:
        path: /etc/aggregare/habitsync-password-rotated
        state: touch
        owner: root
        group: root
        mode: '0600'

- name: Refresh the deployment report without the rotated password
  ansible.builtin.import_playbook: report.yml
