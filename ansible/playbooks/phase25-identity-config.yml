---
- name: Persist identity selection and deploy Kanidm when selected
  hosts: aggregare
  gather_facts: false
  become: true
  vars:
    aggregare_identity_config_file: /etc/aggregare/identity.json
    aggregare_kanidm_version: 1.11.2
    aggregare_kanidm_image: "docker.io/kanidm/server:{{ aggregare_kanidm_version }}"
    aggregare_kanidm_data_dir: /var/lib/aggregare/kanidm
    aggregare_kanidm_config_dir: /etc/aggregare/kanidm
    aggregare_kanidm_tls_chain_target: "{{ aggregare_kanidm_data_dir }}/chain.pem"
    aggregare_kanidm_tls_key_target: "{{ aggregare_kanidm_data_dir }}/key.pem"
    aggregare_kanidm_dev_tls_marker: "{{ aggregare_kanidm_data_dir }}/.aggregare-development-tls.json"
    aggregare_kanidm_dev_ca_target: "{{ aggregare_kanidm_data_dir }}/ca.pem"
    aggregare_kanidm_tls_chain_validation_path: "{{ aggregare_kanidm_tls_chain_source | default(aggregare_kanidm_tls_chain_target) }}"
    aggregare_kanidm_tls_key_validation_path: "{{ aggregare_kanidm_tls_key_source | default(aggregare_kanidm_tls_key_target) }}"
    aggregare_kanidm_origin_host: "{{ aggregare_identity_origin_effective | regex_replace('^https://', '') | regex_replace(':([0-9]+)$', '') }}"
    aggregare_kanidm_preflight_tool: "{{ playbook_dir }}/../../tools/aggregare-identity-preflight"
    aggregare_kanidm_tls_mode_effective: "{{ aggregare_kanidm_tls_mode | default((aggregare_identity_saved_config | default({})).tls_mode | default('provided')) }}"
  tasks:
    - name: Inspect persistent identity configuration
      ansible.builtin.stat:
        path: "{{ aggregare_identity_config_file }}"
      register: aggregare_identity_config_stat

    - name: Read persistent identity configuration
      ansible.builtin.slurp:
        src: "{{ aggregare_identity_config_file }}"
      register: aggregare_identity_config_slurp
      when: aggregare_identity_config_stat.stat.exists

    - name: Parse persistent identity configuration
      ansible.builtin.set_fact:
        aggregare_identity_saved_config: "{{ aggregare_identity_config_slurp.content | b64decode | from_json }}"
      when: aggregare_identity_config_stat.stat.exists

    - name: Validate existing identity configuration
      ansible.builtin.assert:
        that:
          - aggregare_identity_saved_config is mapping
          - aggregare_identity_saved_config.schema_version | default(0) in [1, 2, 3]
          - aggregare_identity_saved_config.identity_provider | default('') in ['kanidm', 'external_oidc', 'none']
          - >-
            (aggregare_identity_saved_config.schema_version == 1 and
             aggregare_identity_saved_config.keys() | list | sort == ['identity_provider', 'schema_version']) or
            (aggregare_identity_saved_config.schema_version == 2 and
             aggregare_identity_saved_config.identity_provider == 'kanidm' and
             aggregare_identity_saved_config.identity_domain is string and
             aggregare_identity_saved_config.identity_origin is string and
             aggregare_identity_saved_config.keys() | list | sort ==
             ['identity_domain', 'identity_origin', 'identity_provider', 'schema_version']) or
            (aggregare_identity_saved_config.schema_version == 3 and
             aggregare_identity_saved_config.identity_provider == 'kanidm' and
             aggregare_identity_saved_config.identity_domain is string and
             aggregare_identity_saved_config.identity_origin is string and
             aggregare_identity_saved_config.tls_mode in ['provided', 'development'] and
             aggregare_identity_saved_config.keys() | list | sort ==
             ['identity_domain', 'identity_origin', 'identity_provider', 'schema_version', 'tls_mode'])
        fail_msg: "{{ aggregare_identity_config_file }} is invalid; preserve a backup and repair it before applying identity configuration."
      when: aggregare_identity_config_stat.stat.exists

    - name: Require an explicit provider for a new identity configuration
      ansible.builtin.assert:
        that:
          - aggregare_identity_provider is defined
          - aggregare_identity_provider in ['kanidm', 'external_oidc', 'none']
        fail_msg: Set aggregare_identity_provider to kanidm, external_oidc, or none.
      when: not aggregare_identity_config_stat.stat.exists

    - name: Resolve selected identity provider
      ansible.builtin.set_fact:
        aggregare_identity_provider_effective: "{{ aggregare_identity_provider if aggregare_identity_provider is defined else aggregare_identity_saved_config.identity_provider }}"

    - name: Reuse the persisted Kanidm endpoint when no replacement was supplied
      ansible.builtin.set_fact:
        aggregare_identity_domain_effective: "{{ aggregare_identity_domain | default(aggregare_identity_saved_config.identity_domain | default('')) }}"
        aggregare_identity_origin_effective: "{{ aggregare_identity_origin | default(aggregare_identity_saved_config.identity_origin | default('')) }}"

    - name: Reject an ordinary provider change
      ansible.builtin.assert:
        that:
          - aggregare_identity_provider == aggregare_identity_saved_config.identity_provider or aggregare_identity_provider_update | default(false) | bool
        fail_msg: "Requested identity provider conflicts with {{ aggregare_identity_config_file }}. Set aggregare_identity_provider_update=true to intentionally replace the saved choice."
      when: aggregare_identity_config_stat.stat.exists and aggregare_identity_provider is defined

    - name: Validate the selected Kanidm domain and HTTPS origin
      ansible.builtin.assert:
        that:
          - aggregare_identity_domain_effective | length > 0
          - aggregare_identity_origin_effective | length > 0
          - aggregare_identity_domain_effective is match('^(?=.{1,253}$)([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$')
          - aggregare_identity_origin_effective is match('^https://[^/]+$')
          - "(aggregare_identity_origin_effective | regex_replace('^https://', '') | regex_replace(':([0-9]+)$', '') | lower) == (aggregare_identity_domain_effective | lower) or (aggregare_identity_origin_effective | regex_replace('^https://', '') | regex_replace(':([0-9]+)$', '') | lower).endswith('.' ~ (aggregare_identity_domain_effective | lower))"
          - aggregare_kanidm_tls_mode_effective in ['provided', 'development']
          - >-
            (aggregare_kanidm_tls_mode_effective == 'development' and
             (aggregare_kanidm_tls_chain_source is not defined and aggregare_kanidm_tls_key_source is not defined)) or
            (aggregare_kanidm_tls_mode_effective == 'provided' and
             ((aggregare_kanidm_tls_chain_source is defined and aggregare_kanidm_tls_key_source is defined) or
              (aggregare_identity_saved_config | default({})).schema_version | default(0) in [2, 3]))
          - (aggregare_kanidm_tls_chain_source is defined) == (aggregare_kanidm_tls_key_source is defined)
          - aggregare_kanidm_tls_chain_source | default('') | length > 0 or aggregare_kanidm_tls_chain_source is not defined
          - aggregare_kanidm_tls_key_source | default('') | length > 0 or aggregare_kanidm_tls_key_source is not defined
        fail_msg: >-
          Kanidm needs an administrator-selected DNS domain and HTTPS origin consistent with that domain,
          plus supplied certificate files or explicit opt-in to Kanidm evaluation certificates for development.
      when: aggregare_identity_provider_effective == 'kanidm'

    - name: Reject changing an established Kanidm identity domain or origin
      ansible.builtin.assert:
        that:
          - aggregare_identity_saved_config.identity_domain | default(aggregare_identity_domain_effective) == aggregare_identity_domain_effective
          - aggregare_identity_saved_config.identity_origin | default(aggregare_identity_origin_effective) == aggregare_identity_origin_effective
        fail_msg: >-
          The saved Kanidm identity domain/origin cannot be changed in place. Changing identity domains after
          enrollment requires an explicit migration procedure. Restore the saved values or plan a migration.
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_identity_config_stat.stat.exists
        - aggregare_identity_saved_config.identity_domain is defined

    - name: Reject changing the established Kanidm TLS mode in place
      ansible.builtin.assert:
        that:
          - aggregare_identity_saved_config.tls_mode == aggregare_kanidm_tls_mode_effective
        fail_msg: >-
          The established Kanidm TLS mode cannot be changed as part of ordinary reapplication. Preserve its
          certificate material or plan an explicit TLS migration.
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_identity_saved_config is defined
        - aggregare_identity_saved_config.tls_mode is defined

    - name: Inspect administrator-provided certificate files before changes
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ [aggregare_kanidm_tls_chain_source | default(''), aggregare_kanidm_tls_key_source | default('')] }}"
      register: aggregare_kanidm_tls_source_stats
      delegate_to: localhost
      run_once: true
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'provided'
        - aggregare_kanidm_tls_chain_source is defined

    - name: Require readable administrator-provided TLS files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.readable
          - item.stat.size | int > 0
        fail_msg: The configured Kanidm TLS certificate chain and private key must be readable regular files on the Ansible controller.
      loop: "{{ aggregare_kanidm_tls_source_stats.results | default([]) }}"
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'provided'
        - aggregare_kanidm_tls_chain_source is defined

    - name: Inspect persisted Kanidm certificate files when reapplying saved settings
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ aggregare_kanidm_tls_chain_target }}"
        - "{{ aggregare_kanidm_tls_key_target }}"
      register: aggregare_kanidm_persisted_tls_stats
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'provided'
        - aggregare_kanidm_tls_chain_source is not defined

    - name: Require persisted Kanidm certificate files on reapplication
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.readable
          - item.stat.size | int > 0
        fail_msg: Saved Kanidm endpoint settings exist, but the installed TLS certificate/key files are missing or empty; supply them with the playbook variables.
      loop: "{{ aggregare_kanidm_persisted_tls_stats.results | default([]) }}"
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'provided'
        - aggregare_kanidm_tls_chain_source is not defined

    - name: Validate the supplied Kanidm certificate covers the selected HTTPS hostname
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ aggregare_kanidm_tls_chain_validation_path }}"
          - -noout
          - -checkhost
          - "{{ aggregare_kanidm_origin_host }}"
          - -checkend
          - "0"
      delegate_to: "{{ 'localhost' if aggregare_kanidm_tls_chain_source is defined else inventory_hostname }}"
      register: aggregare_kanidm_certificate_check
      changed_when: false
      failed_when: false
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'provided'

    - name: Read the certificate public key
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ aggregare_kanidm_tls_chain_validation_path }}", -pubkey, -noout]
      delegate_to: "{{ 'localhost' if aggregare_kanidm_tls_chain_source is defined else inventory_hostname }}"
      register: aggregare_kanidm_certificate_public_key
      changed_when: false
      failed_when: false
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'provided'

    - name: Read the supplied private key public component
      ansible.builtin.command:
        argv: [openssl, pkey, -in, "{{ aggregare_kanidm_tls_key_validation_path }}", -pubout, -passin, "pass:"]
      delegate_to: "{{ 'localhost' if aggregare_kanidm_tls_chain_source is defined else inventory_hostname }}"
      register: aggregare_kanidm_private_key_public_component
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'provided'

    - name: Require a valid certificate, hostname match, and matching private key
      ansible.builtin.assert:
        that:
          - aggregare_kanidm_certificate_check.rc == 0
          - aggregare_kanidm_certificate_public_key.rc == 0
          - aggregare_kanidm_private_key_public_component.rc == 0
          - aggregare_kanidm_certificate_public_key.stdout == aggregare_kanidm_private_key_public_component.stdout
        fail_msg: >-
          The supplied TLS files must be a valid non-expired PEM certificate for the selected HTTPS hostname
          and its matching unencrypted PEM private key.
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'provided'

    - name: Run shared DNS preflight before changing persistent state
      ansible.builtin.script:
        cmd: "{{ aggregare_kanidm_preflight_tool }} --origin {{ aggregare_identity_origin_effective | quote }} --dns-only --format json"
      register: aggregare_kanidm_preflight
      changed_when: false
      when: aggregare_identity_provider_effective == 'kanidm'

    - name: Report completed pre-deployment DNS preflight
      ansible.builtin.debug:
        msg: "{{ aggregare_kanidm_preflight.stdout | from_json }}"
      when: aggregare_identity_provider_effective == 'kanidm'

    - name: Inspect development Kanidm data directory before certificate generation
      ansible.builtin.stat:
        path: "{{ aggregare_kanidm_data_dir }}"
      register: aggregare_kanidm_dev_data_stat
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'

    - name: Inspect existing development data directory entries
      ansible.builtin.find:
        paths: "{{ aggregare_kanidm_data_dir }}"
        file_type: any
        hidden: true
      register: aggregare_kanidm_dev_data_entries
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - aggregare_kanidm_dev_data_stat.stat.isdir | default(false)
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'

    - name: Refuse development certificate generation over any existing identity material
      ansible.builtin.assert:
        that:
          - not (aggregare_kanidm_dev_data_stat.stat.exists and (aggregare_kanidm_dev_data_entries.matched | default(0) | int > 0)) or aggregare_kanidm_dev_tls_marker in (aggregare_kanidm_dev_data_entries.files | map(attribute='path') | list)
        fail_msg: >-
          Development certificates can only be generated into an empty Kanidm data directory. Existing files may
          include certificate material or an identity database; nothing was overwritten. Use supplied TLS files
          for an existing deployment.
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'

    - name: Install Podman for Kanidm certificate generation
      ansible.builtin.apt:
        name: podman
        state: present
        update_cache: true
        cache_valid_time: 3600
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'

    - name: Inspect interrupted development certificate generation marker
      ansible.builtin.stat:
        path: "{{ aggregare_kanidm_dev_tls_marker }}"
      register: aggregare_kanidm_dev_tls_marker_stat
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'

    - name: Reuse interrupted development setup only when endpoint metadata matches
      ansible.builtin.assert:
        that:
          - aggregare_kanidm_dev_tls_marker_stat.stat.exists
        fail_msg: >-
          The Kanidm data directory contains existing files but has no Aggregare development TLS marker.
          Refusing to generate over or adopt unknown certificate/database files; inspect it before retrying.
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - aggregare_kanidm_dev_data_stat.stat.exists
        - (aggregare_kanidm_dev_data_entries.matched | default(0) | int > 0)
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'

    - name: Create empty development Kanidm data directory
      ansible.builtin.file:
        path: "{{ aggregare_kanidm_data_dir }}"
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0750'
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'
        - not aggregare_kanidm_dev_tls_marker_stat.stat.exists | default(false)

    - name: Install Kanidm server configuration for development certificate generation
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kanidm-server.toml.j2"
        dest: "{{ aggregare_kanidm_data_dir }}/server.toml"
        owner: root
        group: root
        mode: '0644'
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'
        - not aggregare_kanidm_dev_tls_marker_stat.stat.exists | default(false)

    - name: Generate Kanidm evaluation certificates with the pinned server image
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - --user
          - '1000:1000'
          - --volume
          - "{{ aggregare_kanidm_data_dir }}:/data:Z"
          - "{{ aggregare_kanidm_image }}"
          - kanidmd
          - cert-generate
      register: aggregare_kanidm_cert_generate
      changed_when: true
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'
        - not aggregare_kanidm_dev_tls_marker_stat.stat.exists | default(false)

    - name: Record successful Kanidm evaluation certificate generation
      ansible.builtin.copy:
        dest: "{{ aggregare_kanidm_dev_tls_marker }}"
        content: "{{ {'identity_domain': aggregare_identity_domain_effective, 'identity_origin': aggregare_identity_origin_effective, 'generator': 'kanidmd cert-generate', 'image': aggregare_kanidm_image} | to_nice_json }}\n"
        owner: root
        group: root
        mode: '0600'
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'
        - not aggregare_kanidm_dev_tls_marker_stat.stat.exists | default(false)

    - name: Verify interrupted development setup endpoint metadata
      ansible.builtin.slurp:
        src: "{{ aggregare_kanidm_dev_tls_marker }}"
      register: aggregare_kanidm_dev_tls_marker_contents
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - aggregare_kanidm_dev_tls_marker_stat.stat.exists | default(false)
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'

    - name: Reject interrupted development setup for a different identity endpoint
      ansible.builtin.assert:
        that:
          - (aggregare_kanidm_dev_tls_marker_contents.content | b64decode | from_json).identity_domain == aggregare_identity_domain_effective
          - (aggregare_kanidm_dev_tls_marker_contents.content | b64decode | from_json).identity_origin == aggregare_identity_origin_effective
        fail_msg: Existing development TLS files belong to a different identity endpoint; refusing to change them.
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'
        - aggregare_kanidm_dev_tls_marker_stat.stat.exists | default(false)
        - (aggregare_identity_saved_config | default({})).tls_mode | default('') != 'development'

    - name: Inspect persisted development Kanidm TLS files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ aggregare_kanidm_tls_chain_target }}"
        - "{{ aggregare_kanidm_tls_key_target }}"
        - "{{ aggregare_kanidm_dev_ca_target }}"
      register: aggregare_kanidm_generated_tls_stats
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'

    - name: Require generated or previously persisted development TLS files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.readable
          - item.stat.size | int > 0
        fail_msg: Kanidm did not leave its development CA, certificate chain, and private key in persistent storage; inspect cert-generate output before retrying.
      loop: "{{ aggregare_kanidm_generated_tls_stats.results | default([]) }}"
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - aggregare_kanidm_tls_mode_effective == 'development'

    - name: Validate the selected Kanidm certificate covers the HTTPS hostname
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ aggregare_kanidm_tls_chain_validation_path }}", -noout, -checkhost, "{{ aggregare_kanidm_origin_host }}", -checkend, '0']
      register: aggregare_kanidm_certificate_check
      delegate_to: "{{ 'localhost' if aggregare_kanidm_tls_mode_effective == 'provided' and aggregare_kanidm_tls_chain_source is defined else inventory_hostname }}"
      changed_when: false
      failed_when: false
      when: aggregare_identity_provider_effective == 'kanidm'

    - name: Read the selected certificate public key
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ aggregare_kanidm_tls_chain_validation_path }}", -pubkey, -noout]
      register: aggregare_kanidm_certificate_public_key
      delegate_to: "{{ 'localhost' if aggregare_kanidm_tls_mode_effective == 'provided' and aggregare_kanidm_tls_chain_source is defined else inventory_hostname }}"
      changed_when: false
      failed_when: false
      when: aggregare_identity_provider_effective == 'kanidm'

    - name: Read the selected private key public component
      ansible.builtin.command:
        argv: [openssl, pkey, -in, "{{ aggregare_kanidm_tls_key_validation_path }}", -pubout, -passin, 'pass:']
      register: aggregare_kanidm_private_key_public_component
      delegate_to: "{{ 'localhost' if aggregare_kanidm_tls_mode_effective == 'provided' and aggregare_kanidm_tls_key_source is defined else inventory_hostname }}"
      changed_when: false
      failed_when: false
      no_log: true
      when: aggregare_identity_provider_effective == 'kanidm'

    - name: Require a valid certificate, hostname match, and matching private key
      ansible.builtin.assert:
        that:
          - aggregare_kanidm_certificate_check.rc == 0
          - aggregare_kanidm_certificate_public_key.rc == 0
          - aggregare_kanidm_private_key_public_component.rc == 0
          - aggregare_kanidm_certificate_public_key.stdout == aggregare_kanidm_private_key_public_component.stdout
        fail_msg: >-
          The selected certificate must be valid for the identity HTTPS hostname and match its private key.
          Generated evaluation certificates are not trusted by other devices until their public certificate is
          explicitly installed in those devices' trust stores.
      when: aggregare_identity_provider_effective == 'kanidm'

    - name: Ensure persistent identity configuration directory exists
      ansible.builtin.file:
        path: "{{ aggregare_identity_config_file | dirname }}"
        state: directory
        mode: '0755'

    - name: Persist version 3 Kanidm endpoint and TLS mode
      ansible.builtin.copy:
        dest: "{{ aggregare_identity_config_file }}"
        content: "{{ {'schema_version': 3, 'identity_provider': 'kanidm', 'identity_domain': aggregare_identity_domain_effective, 'identity_origin': aggregare_identity_origin_effective, 'tls_mode': aggregare_kanidm_tls_mode_effective} | to_nice_json }}\n"
        mode: '0644'
      when:
        - aggregare_identity_provider_effective == 'kanidm'
        - not aggregare_identity_config_stat.stat.exists or aggregare_identity_saved_config.schema_version | default(0) != 3

    - name: Persist external OIDC or none selection
      ansible.builtin.copy:
        dest: "{{ aggregare_identity_config_file }}"
        content: "{{ {'schema_version': 1, 'identity_provider': aggregare_identity_provider_effective} | to_nice_json }}\n"
        mode: '0644'
      when:
        - aggregare_identity_provider_effective in ['external_oidc', 'none']
        - not aggregare_identity_config_stat.stat.exists or aggregare_identity_saved_config.identity_provider | default('') != aggregare_identity_provider_effective

    - name: Deploy Kanidm service
      when: aggregare_identity_provider_effective == 'kanidm'
      block:
        - name: Install Podman for Kanidm
          ansible.builtin.apt:
            name: podman
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create Kanidm persistent directories
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.group }}"
            mode: "{{ item.mode }}"
          loop:
            - { path: "{{ aggregare_kanidm_data_dir }}", owner: '1000', group: '1000', mode: '0750' }
            - { path: "{{ aggregare_kanidm_config_dir }}", owner: root, group: root, mode: '0750' }
            - { path: /etc/containers/systemd, owner: root, group: root, mode: '0755' }

        - name: Install Kanidm server configuration
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/kanidm-server.toml.j2"
            dest: "{{ aggregare_kanidm_data_dir }}/server.toml"
            owner: root
            group: root
            mode: '0644'
          register: aggregare_kanidm_server_config

        - name: Install administrator-provided Kanidm TLS chain
          ansible.builtin.copy:
            src: "{{ aggregare_kanidm_tls_chain_source }}"
            dest: "{{ aggregare_kanidm_tls_chain_target }}"
            owner: '1000'
            group: '1000'
            mode: '0644'
          register: aggregare_kanidm_tls_chain
          when: aggregare_kanidm_tls_chain_source is defined

        - name: Install administrator-provided Kanidm TLS key
          ansible.builtin.copy:
            src: "{{ aggregare_kanidm_tls_key_source }}"
            dest: "{{ aggregare_kanidm_tls_key_target }}"
            owner: '1000'
            group: '1000'
            mode: '0600'
          register: aggregare_kanidm_tls_key
          no_log: true
          when: aggregare_kanidm_tls_key_source is defined

        - name: Install Kanidm Quadlet service definition
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/kanidm.container.j2"
            dest: /etc/containers/systemd/aggregare-kanidm.container
            owner: root
            group: root
            mode: '0644'
          register: aggregare_kanidm_quadlet

        - name: Reload systemd for Kanidm Quadlet
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: aggregare_kanidm_quadlet.changed

        - name: Start or safely reapply Kanidm service
          ansible.builtin.systemd_service:
            name: aggregare-kanidm.service
            enabled: true
            state: "{{ 'restarted' if aggregare_kanidm_quadlet.changed or aggregare_kanidm_server_config.changed or aggregare_kanidm_tls_chain.changed or aggregare_kanidm_tls_key.changed else 'started' }}"

        - name: Verify Kanidm status endpoint
          ansible.builtin.uri:
            url: "{{ aggregare_identity_origin_effective }}/status"
            method: GET
            status_code: 200
            validate_certs: true
            ca_path: "{{ aggregare_kanidm_dev_ca_target if aggregare_kanidm_tls_mode_effective == 'development' else identity_preflight_cafile | default(omit) }}"
          register: aggregare_kanidm_health
          retries: 30
          delay: 5
          until: aggregare_kanidm_health.status == 200

        - name: Read development certificate SHA-256 fingerprint
          ansible.builtin.command:
            argv: [openssl, x509, -in, "{{ aggregare_kanidm_dev_ca_target }}", -noout, -fingerprint, -sha256]
          register: aggregare_kanidm_dev_tls_fingerprint
          changed_when: false
          when: aggregare_kanidm_tls_mode_effective == 'development'

        - name: Explain development certificate trust requirements
          ansible.builtin.debug:
            msg: >-
              DEVELOPMENT ONLY: Kanidm generated a self-signed evaluation certificate. It is not publicly trusted.
              SHA-256 fingerprint: {{ aggregare_kanidm_dev_tls_fingerprint.stdout }}.
              The public CA certificate is at {{ aggregare_kanidm_dev_ca_target }}. To trust it on a Linux client,
              copy that public file to /usr/local/share/ca-certificates/aggregare-kanidm-dev.crt and run
              sudo update-ca-certificates. Import only the public certificate; never copy key.pem to a client.
              Browsers and other operating systems need the equivalent explicit trust-store import.
          when: aggregare_kanidm_tls_mode_effective == 'development'

    - name: Report effective identity configuration
      ansible.builtin.debug:
        msg: >-
          Identity provider is {{ aggregare_identity_provider_effective }}.
          {% if aggregare_identity_provider_effective == 'kanidm' %}Kanidm {{ aggregare_kanidm_version }} is running at {{ aggregare_identity_origin_effective }}.{% else %}No Kanidm service was installed.{% endif %}
