- name: Install or remove Redless
  hosts: aggregare
  become: true
  vars:
    python_app_id: redless
    python_app_version: main
    python_app_source: https://github.com/azwarners/Redless.git
    python_app_ref: main
    python_app_module: minisweagent
  tasks:
  - name: Install Redless from its main branch
    ansible.builtin.import_role:
      name: python_app
