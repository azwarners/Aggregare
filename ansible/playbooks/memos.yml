- name: Install or remove Memos
  hosts: aggregare
  become: true
  vars:
    application_id: memos
    application_version: 0.31.0
    application_image: ghcr.io/usememos/memos:0.31.0
    application_host_port: 5230
    application_container_port: 5230
    application_data_path: /var/lib/aggregare/memos
    application_container_data_path: /var/opt/memos
    application_health_path: /api/v1/ping
  tasks:
  - name: Apply the shared OCI application role
    ansible.builtin.import_role:
      name: container_app
  - name: Brand the server login message
    ansible.builtin.import_role:
      name: aggregare_welcome
